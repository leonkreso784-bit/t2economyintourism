  - main [ref=e6]:
    - heading "Privacy Policy" [level=1] [ref=e7]
    - paragraph [ref=e8]: "Last updated: 8 August 2026 (self-service account deletion added)"
    - paragraph [ref=e9]:
      - text: Sokrat Study ("we", "us") is a free study platform available at
      - link "www.sokratstudy.com" [ref=e10] [cursor=pointer]:
        - /url: https://www.sokratstudy.com
      - text: ", operated by"
      - strong [ref=e11]: Leon Kreso
      - text: (Croatia). This policy explains what personal data we process, why, and what rights you have under the EU General Data Protection Regulation (GDPR).
    - heading "1. Data we collect" [level=2] [ref=e12]
    - list [ref=e13]:
      - listitem [ref=e14]:
        - strong [ref=e15]: "Without an account:"
        - text: we collect no personal data. Your study progress (flashcards learned, quiz scores, study statistics) is stored only in your browser's local storage, on your device. It never leaves your device.
      - listitem [ref=e16]:
        - strong [ref=e17]: "With an account (optional):"
        - text: if you create an account, we store your
        - strong [ref=e18]: name
        - text: (shown on your profile), your
        - strong [ref=e19]: email address
        - text: ", your"
        - strong [ref=e20]: password
        - text: (stored only as a secure cryptographic hash by our authentication provider — we never see or store the password itself) and your
        - strong [ref=e21]: study progress
        - text: (so it can sync across your devices). That's all — no payment data, no tracking profiles.
    - heading "2. How we use your data" [level=2] [ref=e22]
    - list [ref=e23]:
      - listitem [ref=e24]: To sign you in (email + password; we also send a one-time confirmation email when you register and password-reset emails when you request them).
      - listitem [ref=e25]: To back up and synchronise your study progress across devices.
      - listitem [ref=e26]:
        - text: We do
        - strong [ref=e27]: not
        - text: sell or share your data with third parties for marketing.
    - heading "3. Legal basis" [level=2] [ref=e28]
    - paragraph [ref=e29]: Processing is based on the performance of a contract (providing the account and sync features you request, Art. 6(1)(b) GDPR). Creating an account is entirely optional — the platform is fully usable without one.
    - heading "4. Where your data is stored" [level=2] [ref=e30]
    - paragraph [ref=e31]:
      - text: Account and progress data are stored with
      - strong [ref=e32]: Supabase
      - text: (our database and authentication provider) on servers in the European Union. Data in transit is encrypted (HTTPS), and database access is restricted so each user can only access their own records. The website is hosted on
      - strong [ref=e33]: Vercel
      - text: .
    - heading "5. Cookies and analytics" [level=2] [ref=e34]
    - paragraph [ref=e35]:
      - strong [ref=e36]: "Essential local storage (always on):"
      - text: we use your browser's local storage strictly for the platform to function — your study progress, interface preferences, and (if signed in) your session token. This stays on your device and requires no consent.
    - paragraph [ref=e37]:
      - strong [ref=e38]: "Analytics cookies (optional, consent-based):"
      - text: with your consent we use
      - strong [ref=e39]: Google Analytics (GA4)
      - text: to understand how visitors use the site (for example, which pages are viewed and roughly where visitors come from) so we can improve it. These cookies are loaded
      - strong [ref=e40]: only after you click "Accept"
      - text: in the cookie banner; if you click "Reject" (or do nothing), no analytics cookies are set. We use Google
      - emphasis [ref=e41]: Consent Mode
      - text: and IP-anonymisation, and we do not use this data to identify you personally. The legal basis is your
      - strong [ref=e42]: consent
      - text: (Art. 6(1)(a) GDPR).
    - paragraph [ref=e43]:
      - text: You can change or withdraw your choice at any time via the
      - strong [ref=e44]: "\"Cookie settings\""
      - text: link in the website footer. Analytics data is processed by Google; see Google's own privacy documentation for details. We use
      - strong [ref=e45]: no advertising cookies
      - text: ; if that ever changes (e.g. if we show ads), we will update this policy and ask for your consent first.
    - paragraph [ref=e46]:
      - strong [ref=e47]: "Error monitoring (optional, consent-based):"
      - text: under the same consent we use
      - strong [ref=e48]: Sentry
      - text: to be notified automatically when something breaks in the app, so we can fix it quickly. It loads
      - strong [ref=e49]: only after you click "Accept"
      - text: (never if you Reject). It sends
      - strong [ref=e50]: technical error reports only
      - text: — the error message, a code stack trace, and basic technical context (page address, browser type). We
      - strong [ref=e51]: disable
      - text: personal-data collection (no IP or user identification), and we do
      - strong [ref=e52]: not
      - text: record your screen or session and do
      - strong [ref=e53]: not
      - text: track performance. This error data is processed by Sentry in the
      - strong [ref=e54]: European Union (Germany)
      - text: . The legal basis is your
      - strong [ref=e55]: consent
      - text: (Art. 6(1)(a) GDPR); you can withdraw it any time via "Cookie settings".
    - heading "6. Data retention" [level=2] [ref=e56]
    - paragraph [ref=e57]: Your account data is kept for as long as your account exists. If you delete your cloud data or your account, the corresponding records are removed from our database.
    - heading "7. Your rights" [level=2] [ref=e58]
    - paragraph [ref=e59]: "Under the GDPR you have the right to access, rectify, export, and erase your personal data, and to lodge a complaint with a supervisory authority (in Croatia: AZOP)."
    - list [ref=e60]:
      - listitem [ref=e61]:
        - strong [ref=e62]: "Delete cloud data:"
        - text: available directly in the app under
        - emphasis [ref=e63]: Profile → Privacy & data → Delete cloud data
        - text: .
      - listitem [ref=e64]:
        - strong [ref=e65]: "Delete your account:"
        - text: available directly in the app under
        - emphasis [ref=e66]: Profile → Privacy & data → Delete account
        - text: . This is a
        - strong [ref=e67]: permanent deletion
        - text: "and takes effect immediately: your login, your study progress, your personal materials and any images you uploaded to them are erased and cannot be recovered. Records of edits to our public catalogue are kept, but your name is removed from them."
      - listitem [ref=e68]:
        - strong [ref=e69]: Any other right
        - text: "(access, rectification, export): email us at"
        - link "leonkreso784@gmail.com" [ref=e70] [cursor=pointer]:
          - /url: mailto:leonkreso784@gmail.com
        - text: — we respond within 30 days.
    - heading "8. Children" [level=2] [ref=e71]
    - paragraph [ref=e72]: The platform is intended for university students. We do not knowingly collect data from children under 16.
    - heading "9. Changes to this policy" [level=2] [ref=e73]
    - paragraph [ref=e74]: We may update this policy as the platform evolves. Material changes will be announced on the website. The date above always reflects the latest version.
    - heading "10. Contact" [level=2] [ref=e75]
    - paragraph [ref=e76]:
      - text: "Data controller: Leon Kreso ·"
