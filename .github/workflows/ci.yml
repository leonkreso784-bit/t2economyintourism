name: CI

# Reliability rails (FOUNDATION_PLAN F1, brick 1A.1/1A.2).
# Svaki push i PR mora proći: validate:content -> verify -> test:unit -> Playwright.
# Crveno = ne ide u main. Ovo je TVRDI gate (FOUNDATION_PLAN §7), ne upozorenje.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Otkaži zastarjele runove iste grane (štedi minute, brži feedback).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + verify + tests
    runs-on: ubuntu-latest
    # ⚠️ MREŽA B6 (2026-09-01): Playwright je IZAŠAO iz ovog joba u zaseban `playwright`
    # matrix-job (shardovi) — ovdje ostaju samo brze brane bez preglednika (fail fast).
    # Povijest granice: 20 → 30 (2026-08-31) jer je job istekao na 20 min 16 s bez ijednog
    # palog testa (rast suite: 16.8 → 18.1 → 18.4 → 20.3 min). Pouka stoji: timeout je
    # zaštita od VISEĆEG procesa, ne budžet izvedbe — kad postane budžet, prestaje
    # razlikovati kvar od sporog stroja. Zato je B6 potez bio sharding, ne veći broj;
    # sljedeći rast suite apsorbira NOVI shard, nikad podizanje timeouta.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps (clean)
        run: npm ci

      # --- Brza, jeftina logika prvo (fail fast prije browsera) ---
      - name: Validate content (schema + quiz index + KaTeX currency-safe)
        run: npm run validate:content

      # Strukturni JSON Schema gate (F2 2A.1): svaki payload sadržaja poštuje
      # schema/subject-content.schema.json (oblik + tipovi + nepoznata polja). Nadopunjuje
      # validate:content (semantika). Postat će gate i nad generiranim .json datotekama (2A.2).
      - name: Validate JSON Schema (structural content contract)
        run: npm run validate:schema

      # Generirani JSON export (F2 2A.2) mora ostati u sinku s izvornim data/*.js.
      # --check ne piše; pad = netko je editirao .js bez re-exporta (ili obrnuto). Round-trip + on-disk sync.
      - name: Content JSON export in sync (round-trip + no drift)
        run: npm run export:json -- --check

      - name: Verify catalog (struktura + datoteke + window varijable)
        run: npm run verify

      # Cache-busting tokeni (F3 3C): svi `?v=` + CONTENT_VERSION moraju biti IDENTIČNI (jedan
      # broj za cijelu aplikaciju). Drift = netko je ručno bumpao podskup → nevidljiv deploy (BUG-004).
      # Popravak: `npm run bump`. TVRDI gate — parcijalni bump = crveno.
      - name: Cache tokens consistent (single version, BUG-004 guard)
        run: npm run bump:check

      # CSS bundle (F3 3B) mora biti u sinku s izvornim css/*.css (styles.css @import red).
      # Drift = netko editirao css bez `npm run build:css`. Round-trip determinističan (LF-normaliziran).
      - name: CSS bundle in sync (no drift)
        run: npm run build:css -- --check

      - name: Unit tests (exercises-core / acc-kernel / stat-parse / stat-lib)
        run: npm run test:unit

      # Type-check bez build-a (tsc --checkJs, samo CI checker; scope raste modul-po-modul).
      - name: Type-check (tsc --checkJs, pilot scope)
        run: npm run typecheck

      # RLS sigurnosni gate (read-only, anon): anon čita javni sadržaj, NE vidi tuđi progress.
      # Tvrdi gate na curenje; preskoči (zeleno) ako je free-tier baza uspavana/nedostupna.
      - name: RLS security check (read-only)
        run: npm run test:rls

  # --- Playwright (responsive overflow + smoke + sidebar) — MREŽA B6: shardovi ---
  # Zašto matrix-shardovi, a ne `workers > 1`: `workers: 1` u playwright.config.js postoji
  # RADI DETERMINIZMA (utrke prijave su već obarale cijeli `authenticated` projekt, vidi
  # tests/auth.setup.js) — sharding reže suitu PO DATOTEKAMA na N neovisnih procesa i u
  # svakom zadržava workers: 1, pa determinizam unutar procesa ostaje netaknut.
  # `needs: build` čuva izvorni dizajn „fail fast prije preglednika“: shard se ne pali dok
  # jeftine brane ne prođu. `fail-fast: false` da pad jednog sharda ne guta dijagnostiku
  # drugog. Rast suite se apsorbira dodavanjem sharda u matricu, ne dizanjem timeouta.
  playwright:
    name: Playwright shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    needs: build
    runs-on: ubuntu-latest
    # Pola suite (~10 min s pripremom) uz dvostruku maržu — zaštita od visećeg procesa,
    # ne budžet izvedbe (vidi komentar na `build`).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps (clean)
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Playwright tests (shard)
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # Artefakti samo na padu: screenshotovi (screenshot: 'only-on-failure') + report.
      # Ime mora biti jedinstveno po shardu — upload-artifact@v4 odbija duplikat imena.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shardIndex }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Authenticated (admin) suite — POZITIVAN admin-put (F4). Zaseban job: traži pravu Supabase
  # admin-sesiju (storageState), pa treba tajne. Pokreće se SAMO ako je secret TEST_ADMIN_EMAIL
  # postavljen (Settings → Secrets → Actions); inače se čisto preskoči (exit 0) → forkovi/PR-ovi
  # bez tajni ostaju zeleni. ⚠ Može pasti ako je free-tier Supabase uspavan (login ne prođe) —
  # zato je ODVOJEN od glavnog `build` gate-a (ne blokira merge osim ako ga korisnik učini required).
  # Bonus: redoviti run drži bazu budnom. Vidi docs/workflow/TESTING.md §Authenticated.
  authed:
    name: Authed admin suite (positive path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps (clean)
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run authenticated suite (skips if no creds)
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$TEST_ADMIN_EMAIL" ]; then
            echo "TEST_ADMIN_EMAIL secret nije postavljen → preskačem authenticated suite."
            exit 0
          fi
          npm run test:authed
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authed-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
