name: CI

# Reliability rails (FOUNDATION_PLAN F1, brick 1A.1/1A.2).
# Svaki push i PR mora proći: validate:content -> verify -> test:unit -> Playwright.
# Crveno = ne ide u main. Ovo je TVRDI gate (FOUNDATION_PLAN §7), ne upozorenje.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Otkaži zastarjele runove iste grane (štedi minute, brži feedback).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + verify + tests
    runs-on: ubuntu-latest
    # ⚠️ MREŽA B6 (2026-09-01): Playwright je IZAŠAO iz ovog joba u zaseban `playwright`
    # matrix-job (shardovi) — ovdje ostaju samo brze brane bez preglednika (fail fast).
    # Povijest granice: 20 → 30 (2026-08-31) jer je job istekao na 20 min 16 s bez ijednog
    # palog testa (rast suite: 16.8 → 18.1 → 18.4 → 20.3 min). Pouka stoji: timeout je
    # zaštita od VISEĆEG procesa, ne budžet izvedbe — kad postane budžet, prestaje
    # razlikovati kvar od sporog stroja. Zato je B6 potez bio sharding, ne veći broj;
    # sljedeći rast suite apsorbira NOVI shard, nikad podizanje timeouta.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps (clean)
        run: npm ci

      # --- Brza, jeftina logika prvo (fail fast prije browsera) ---
      - name: Validate content (schema + quiz index + KaTeX currency-safe)
        run: npm run validate:content

      # Strukturni JSON Schema gate (F2 2A.1): svaki payload sadržaja poštuje
      # schema/subject-content.schema.json (oblik + tipovi + nepoznata polja). Nadopunjuje
      # validate:content (semantika). Postat će gate i nad generiranim .json datotekama (2A.2).
      - name: Validate JSON Schema (structural content contract)
        run: npm run validate:schema

      # Generirani JSON export (F2 2A.2) mora ostati u sinku s izvornim data/*.js.
      # --check ne piše; pad = netko je editirao .js bez re-exporta (ili obrnuto). Round-trip + on-disk sync.
      - name: Content JSON export in sync (round-trip + no drift)
        run: npm run export:json -- --check

      - name: Verify catalog (struktura + datoteke + window varijable)
        run: npm run verify

      # Cache-busting tokeni (F3 3C): svi `?v=` + CONTENT_VERSION moraju biti IDENTIČNI (jedan
      # broj za cijelu aplikaciju). Drift = netko je ručno bumpao podskup → nevidljiv deploy (BUG-004).
      # Popravak: `npm run bump`. TVRDI gate — parcijalni bump = crveno.
      - name: Cache tokens consistent (single version, BUG-004 guard)
        run: npm run bump:check

      # CSS bundle (F3 3B) mora biti u sinku s izvornim css/*.css (styles.css @import red).
      # Drift = netko editirao css bez `npm run build:css`. Round-trip determinističan (LF-normaliziran).
      - name: CSS bundle in sync (no drift)
        run: npm run build:css -- --check

      - name: Unit tests (exercises-core / acc-kernel / stat-parse / stat-lib)
        run: npm run test:unit

      # Type-check bez build-a (tsc --checkJs, samo CI checker; scope raste modul-po-modul).
      - name: Type-check (tsc --checkJs, pilot scope)
        run: npm run typecheck

      # RLS sigurnosni gate (read-only, anon): anon čita javni sadržaj, NE vidi tuđi progress.
      # Tvrdi gate na curenje; preskoči (zeleno) ako je free-tier baza uspavana/nedostupna.
      - name: RLS security check (read-only)
        run: npm run test:rls

  # --- Playwright (responsive overflow + smoke + sidebar) — MREŽA B6: shardovi ---
  # Zašto matrix-shardovi, a ne `workers > 1`: `workers: 1` u playwright.config.js postoji
  # RADI DETERMINIZMA (utrke prijave su već obarale cijeli `authenticated` projekt, vidi
  # tests/auth.setup.js) — sharding reže suitu PO DATOTEKAMA na N neovisnih procesa i u
  # svakom zadržava workers: 1, pa determinizam unutar procesa ostaje netaknut.
  # `needs: build` čuva izvorni dizajn „fail fast prije preglednika“: shard se ne pali dok
  # jeftine brane ne prođu. `fail-fast: false` da pad jednog sharda ne guta dijagnostiku
  # drugog. Rast suite se apsorbira dodavanjem sharda u matricu, ne dizanjem timeouta.
  playwright:
    name: Playwright shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    needs: build
    runs-on: ubuntu-latest
    # Pola suite (~10 min s pripremom) uz dvostruku maržu — zaštita od visećeg procesa,
    # ne budžet izvedbe (vidi komentar na `build`).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps (clean)
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Playwright tests (shard)
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # Artefakti samo na padu: screenshotovi (screenshot: 'only-on-failure') + report.
      # Ime mora biti jedinstveno po shardu — upload-artifact@v4 odbija duplikat imena.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shardIndex }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Authenticated (admin) suite — POZITIVAN admin-put (F4). Zaseban job: traži pravu Supabase
  # admin-sesiju (storageState), pa treba tajne. Vidi docs/workflow/TESTING.md §Authenticated.
  #
  # ⚠️ OVAJ JOB JE DO 2026-09-24 BIO PRAZAN HOD. Izmjereno: korak koji pokreće suite trajao je
  # 0 sekundi u zadnjih 12 vrtnji (e23d658 … 921cfbc), jer je bio napisan kao „ako je
  # TEST_ADMIN_EMAIL prazan → exit 0", a taj secret nikad nije bio postavljen (PROGRESS,
  # 34b3612, 2026-07-08: „⏳ Leon doda repo-secrete"). Dakle 34 authed datoteke nisu se
  # izvrtjele NI NA JEDNOM commitu — a job je svaki put uredno instalirao Chromium (25 s) pa
  # ga nije upotrijebio. Zeleno je značilo „nisam ništa izmjerio", što se ne razlikuje od
  # „sve je u redu". Zato je `exit 0` zamijenjen granom koja PADA (scripts/ci-tajne.js).
  #
  # ⚠️ TAJNE SU STAGING_*, NE PRODUKCIJSKE (Leonova odluka 2026-09-24, anketa). auth.setup.js
  # na njih preusmjeri aplikaciju, pa write-testovi gađaju izolirani test-DB i PROD audit
  # (content_versions, append-only) ostaje čist — pravilo #8. S produkcijskim TEST_ADMIN_*
  # isti bi suite pisao u živi sadržaj.
  #
  # ⚠️ KOJE TAJNE OVDJE STOJE NIJE STVAR PROCJENE: `tests/unit/ci-tajne.test.js` čita
  # `tests/**` s diska i traži da env-blok ispod sadrži TOČNO ono što testovi koriste — ni
  # manje (propuštena) ni više (mrtav unos). Peti spec koji sutra zatreba novu tajnu obori
  # branu umjesto da se tiho preskoči.
  authed:
    name: Authed admin suite (positive path)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps (clean)
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      # Tajne se ne smiju „provjeriti" u YAML-u: takav `if` nitko ne može pokrenuti, pa nitko
      # ne može izmjeriti da uvijek ide u exit 0 — točno to se i dogodilo. Provjera je zato
      # SKRIPTA koja se izvodi i ovdje i u brani (tests/unit/ci-tajne.test.js ju STVARNO pusti
      # s podmetnutom praznom tajnom i traži exit 1). Jedna činjenica, jedno mjesto (ADR-027).
      - name: Obavezne tajne su tu (pada ako nisu — NE preskače)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON: ${{ secrets.STAGING_SUPABASE_ANON }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
        run: node scripts/ci-tajne.js --zahtijevaj

      # ⚠️ 6 tvrdnji iz tests/temelj-mreze.authed.spec.js se OVDJE PRESKAČE, i to je odluka a
      # ne propust: traže STAGING_SUPABASE_SERVICE_KEY, koji svjesno ne ide u GitHub secrets
      # (Leon, 2026-09-24). Iznimka je imenovana u scripts/ci-tajne.js, zajedno s cijenom.
      - name: Run authenticated suite (154 tvrdnje, ~15 min)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON: ${{ secrets.STAGING_SUPABASE_ANON }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
        run: npm run test:authed
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authed-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── ROLL-UP: JEDNA provjera koja presuđuje sve ostale ──────────────────────────────────
  # Povod (2026-09-24): `authed` je bio namjerno odvojen od `build` gatea, uz obrazloženje da
  # „ne blokira merge osim ako ga korisnik učini required". Posljedica je bila da njegov pad
  # ne zaustavlja ništa — a kako nikad nije ni vrtio, to se nije imalo gdje pokazati.
  #
  # Zašto roll-up a ne „označi svaki job kao required": broj jobova raste (build → +playwright
  # shardovi → +authed), a required-popis u GitHub postavkama je RUČNO pisan popis izvan
  # repozitorija — dakle isti razred greške koji ovu ciglu i pokreće. S roll-upom označiš JEDNU
  # provjeru (`Gate`), a koje jobove ona pokriva živi u ovoj datoteci i čuva ga brana
  # (tests/unit/ci-tajne.test.js traži da `needs` nabraja SVE ostale jobove).
  #
  # ⚠️ `if: always()` je OBAVEZAN. Bez njega se gate na padu ovisnosti SAM preskoči, a
  # preskočena required-provjera u GitHubu visi kao „pending" → PR se ne da mergeati ni
  # odbiti. Zato gate uvijek vrti i SUDI rezultate, umjesto da se na njih naslanja.
  #
  # ⚠️ Sudi se na `!= success`, ne na `== failure`. Job koji je `cancelled` ili `skipped` nije
  # izmjerio ništa, a `== failure` bi ga pustio kao da je prošao — isti razred greške kao
  # „0 sekundi i zeleno" zbog kojeg cijela cigla postoji.
  gate:
    name: Gate (sve brane zelene)
    needs: [build, playwright, authed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Presudi sve jobove
        env:
          R_BUILD: ${{ needs.build.result }}
          R_PLAYWRIGHT: ${{ needs.playwright.result }}
          R_AUTHED: ${{ needs.authed.result }}
        run: |
          echo "build=$R_BUILD  playwright=$R_PLAYWRIGHT  authed=$R_AUTHED"
          pao=0
          for par in "build:$R_BUILD" "playwright:$R_PLAYWRIGHT" "authed:$R_AUTHED"; do
            ime="${par%%:*}"; ishod="${par#*:}"
            if [ "$ishod" != "success" ]; then
              echo "::error::job '$ime' nije prošao (ishod: $ishod)"
              pao=1
            fi
          done
          if [ "$pao" -ne 0 ]; then
            echo ""
            echo "Gate CRVEN — barem jedan job nije prošao (vidi ::error iznad)."
            exit 1
          fi
          echo "Gate ZELEN — sva tri joba prosla."
